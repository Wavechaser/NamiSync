<!doctype html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NamiSync</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/components.css">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main id="app">
    <header class="nami-shell__header">
      <h1>NamiSync</h1>
      <p id="host-status" role="status" aria-live="polite">Starting...</p>
      <div class="nami-shell__theme">
        <label class="nami-field__label" for="theme-mode">Theme</label>
        <select class="nami-select" id="theme-mode" disabled>
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </header>
  </main>
</body>
</html>
