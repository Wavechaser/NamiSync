[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "namisync"
dynamic = ["version"]
description = "Safety-first one-way file mirroring for Windows"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pywebview==6.2.1",
    "pythonnet==3.1.0; sys_platform == 'win32'",
    "bottle>=0.13.4",
    "xxhash>=3.8.1,<4",
]

[project.scripts]
nami-sync = "namisync.interfaces.launcher:main"

[project.gui-scripts]
nami-sync-gui = "namisync.interfaces.launcher:gui_main"

[project.optional-dependencies]
dev = [
    "import-linter>=2.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["namisync*"]

[tool.setuptools.package-data]
"namisync.interfaces.web" = ["assets/*", "assets/icons/*"]

[tool.setuptools.dynamic]
version = {attr = "namisync.version.VERSION"}

[tool.pytest.ini_options]
addopts = '-m "not headed"'
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
markers = [
    "headed: requires an interactive Windows desktop and the real WebView2 host",
    "supplemental_node: optional deterministic JavaScript probe using Node.js from PATH",
]

[tool.importlinter]
root_package = "namisync"

[[tool.importlinter.contracts]]
name = "Core imports no project layer"
type = "forbidden"
source_modules = ["namisync.core"]
forbidden_modules = [
    "namisync.modules",
    "namisync.db",
    "namisync.workflows",
    "namisync.dispatcher",
    "namisync.interfaces",
]

[[tool.importlinter.contracts]]
name = "Modules import only core"
type = "forbidden"
source_modules = ["namisync.modules"]
forbidden_modules = [
    "namisync.db",
    "namisync.workflows",
    "namisync.dispatcher",
    "namisync.interfaces",
]

[[tool.importlinter.contracts]]
name = "Domain components are mutually independent"
type = "independence"
modules = [
    "namisync.modules.scanner",
    "namisync.modules.planner",
    "namisync.modules.preflight",
    "namisync.modules.executor",
    "namisync.modules.verifier",
]

[[tool.importlinter.contracts]]
name = "Executor native and pipeline leaves are independent"
type = "independence"
modules = [
    "namisync.modules.executor.native",
    "namisync.modules.executor.pipeline",
]

[[tool.importlinter.contracts]]
name = "Executor leaves do not import runtime"
type = "forbidden"
source_modules = [
    "namisync.modules.executor.native",
    "namisync.modules.executor.pipeline",
]
forbidden_modules = ["namisync.modules.executor.runtime"]

[[tool.importlinter.contracts]]
name = "Verifier native does not import engine"
type = "forbidden"
source_modules = ["namisync.modules.verifier.native"]
forbidden_modules = ["namisync.modules.verifier.engine"]

[[tool.importlinter.contracts]]
name = "Database imports only core"
type = "forbidden"
source_modules = ["namisync.db"]
forbidden_modules = [
    "namisync.modules",
    "namisync.workflows",
    "namisync.dispatcher",
    "namisync.interfaces",
]

[[tool.importlinter.contracts]]
name = "Workflows do not import dispatcher or interfaces"
type = "forbidden"
source_modules = ["namisync.workflows"]
forbidden_modules = ["namisync.dispatcher", "namisync.interfaces"]

[[tool.importlinter.contracts]]
name = "Dispatcher imports only core"
type = "forbidden"
source_modules = ["namisync.dispatcher"]
forbidden_modules = [
    "namisync.modules",
    "namisync.db",
    "namisync.workflows",
    "namisync.interfaces",
]

[[tool.importlinter.contracts]]
name = "Interfaces use workflows and dispatcher"
type = "forbidden"
source_modules = ["namisync.interfaces"]
forbidden_modules = ["namisync.core", "namisync.modules", "namisync.db"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Interface adapters depend on the shared service"
type = "layers"
layers = [
    "namisync.interfaces.launcher",
    "namisync.interfaces.cli | namisync.interfaces.web",
    "namisync.interfaces.service",
]
